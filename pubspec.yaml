name: wetube
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.2.6 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  youtube_player_flutter: ^9.1.1
  provider: ^6.0.1
  intl: ^0.20.3
  sqflite: ^2.3.2
  path: any
  path_provider: any
  image_picker: ^1.2.4
  video_player: ^2.14.1
  shared_preferences: ^2.5.6
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon.png" 
  adaptive_icon_background: "#292929"

flutter:
  uses-material-design: true
  assets:
    - assets/video_picture_sample/one.jpeg
    - assets/icon/logo_topbar.png
